apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-demo
  namespace: default
  labels:
    app: vault-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-demo
  template:
    metadata:
      labels:
        app: vault-demo
      annotations:
        # 1. Activer l'injecteur automatique de Vault
        vault.hashicorp.com/agent-inject: "true"
        
        # 2. IGNORER la vérification du certificat SSL de Vault (Nouveau)
        vault.hashicorp.com/tls-skip-verify: "true"
        
        # 3. Indiquer le rôle Vault créé précédemment pour l'authentification
        vault.hashicorp.com/role: "myapp-role"
        
        # 4. Spécifier le secret à récupérer (dans /vault/secrets/config)
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/myapp/config"
        
        # 5. Formater le secret
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/myapp/config" -}}
          [CONFIGURATION DU SECRET DE VAULT]
          Utilisateur : {{ .Data.data.username }}
          Mot de passe : {{ .Data.data.password }}
          {{- end -}}
    spec:
      serviceAccountName: vault-auth
      containers:
      - name: app
        image: alpine
        command: ["sh", "-c", "while true; do cat /vault/secrets/config; sleep 5; done"]
        resources:
          limits:
            memory: "64Mi"
            cpu: "100m"
