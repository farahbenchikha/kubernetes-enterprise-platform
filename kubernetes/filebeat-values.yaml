daemonset:
  filebeatConfig:
    filebeat.yml: |
      filebeat.inputs:
      - type: container
        paths:
          - /var/log/containers/*.log
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
              - logs_path:
                  logs_path: "/var/log/containers/"

      output.elasticsearch:
        hosts: ["https://192.168.233.189:9200"]
        username: "elastic"
        password: "i1*I_3YeN5XP933Wj9Gk"
        ssl.verification_mode: "none" # Ignore le certificat de test auto-signé
