apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-db
  namespace: default
  labels:
    app: mysql-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-db
  template:
    metadata:
      labels:
        app: mysql-db
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_DATABASE
          value: mydb
        - name: MYSQL_USER
          value: farah
        - name: MYSQL_PASSWORD
          value: MySuperSecretDBPassword
        - name: MYSQL_ROOT_PASSWORD
          value: MySuperRootPassword
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-storage
        hostPath:
          path: /mnt/data/mysql
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: default
spec:
  selector:
    app: mysql-db
  ports:
    - port: 3306
      targetPort: 3306