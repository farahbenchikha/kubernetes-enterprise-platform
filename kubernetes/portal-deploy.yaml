apiVersion: apps/v1
kind: Deployment
metadata:
  name: presentation-portal
  namespace: default
  labels:
    app: presentation-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presentation-portal
  template:
    metadata:
      labels:
        app: presentation-portal
    spec:
      containers:
      - name: portal
        image: farahbenchikha/presentation-portal:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: "256Mi"
            cpu: "300m"
          requests:
            memory: "128Mi"
            cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: portal-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: presentation-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30083
